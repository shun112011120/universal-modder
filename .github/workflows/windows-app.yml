name: windows app
on:
  push:
    paths: ["um/**", "packaging/**", "skills/**", "knowledge/**", "tests/test_app.py", "pyproject.toml", "Universal Modder.cmd", "Start Claude Code.cmd", "setup/**", ".github/workflows/windows-app.yml"]
  pull_request:
    paths: ["um/**", "packaging/**", "skills/**", "knowledge/**", "tests/test_app.py", "pyproject.toml", "Universal Modder.cmd", "Start Claude Code.cmd", "setup/**", ".github/workflows/windows-app.yml"]
  workflow_dispatch:
jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: app tests on Windows
        run: uv run --python 3.12 --with pytest pytest -q tests/test_app.py
      - name: setup scripts parse in Windows PowerShell
        shell: powershell
        run: |
          $errs = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile("$PWD\setup\start-claude.ps1", [ref]$null, [ref]$errs)
          if ($errs) { $errs | ForEach-Object { Write-Error $_.ToString() }; exit 1 }
          Write-Host "start-claude.ps1 parses"
      - name: double-click launcher, portable
        shell: pwsh
        run: |
          & ".\Universal Modder.cmd" --self-test
          if ($LASTEXITCODE) { exit 1 }
          if (-not (Test-Path ".\.uv\bin\uv.exe") -or -not (Test-Path ".\data")) { Write-Error "launcher didn't stay in its folder"; exit 1 }
          if (Test-Path "$env:USERPROFILE\.universal-modder") { Write-Error "launcher wrote outside its folder"; exit 1 }
          Remove-Item -Recurse -Force .\data, .\.uv, .\.venv
      - name: build UniversalModder.exe
        run: uv run --python 3.12 --with pyinstaller pyinstaller --noconfirm packaging/universal-modder.spec
      - name: smoke test the build
        run: |
          app="dist/Universal Modder"
          "$app/um.exe" --version
          "$app/um.exe" app --self-test
          test -d "$app/data" && test ! -e "$USERPROFILE/.universal-modder"     # portable: nothing outside the folder
          rm -rf "$app/data"
          cp packaging/README-windows.txt "$app/Read me.txt"
      - uses: actions/upload-artifact@v4
        with:
          name: Universal Modder (Windows)
          path: dist/Universal Modder
          retention-days: 30
