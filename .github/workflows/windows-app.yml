name: windows app
on:
  push:
    paths: ["um/**", "packaging/**", "skills/**", "knowledge/**", "tests/test_app.py", "pyproject.toml", ".github/workflows/windows-app.yml"]
  pull_request:
    paths: ["um/**", "packaging/**", "skills/**", "knowledge/**", "tests/test_app.py", "pyproject.toml", ".github/workflows/windows-app.yml"]
  workflow_dispatch:
jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: app tests on Windows
        run: uv run --python 3.12 --with pytest pytest -q tests/test_app.py
      - name: build UniversalModder.exe
        run: uv run --python 3.12 --with pyinstaller pyinstaller --noconfirm packaging/universal-modder.spec
      - name: smoke test the build
        run: |
          ./dist/UniversalModder/um.exe --version
          ./dist/UniversalModder/um.exe app --self-test
          cp packaging/README-windows.txt "dist/UniversalModder/Read me.txt"
      - uses: actions/upload-artifact@v4
        with:
          name: UniversalModder-windows
          path: dist/UniversalModder
          retention-days: 30
